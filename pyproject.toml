[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seatube-downloader"
version = "0.3.0"
description = "Find annotated marine organisms in SeaTube and extract research-ready frames and clips from Python"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28,<3",
    "python-dotenv>=1,<2",
    "onc>=2,<3",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "pandas>=2,<3"]
dev = ["pytest>=7,<9", "build>=1,<2", "ruff>=0.11,<1"]

[project.scripts]
seatube = "seatube.cli:main"

[project.urls]
Repository = "https://github.com/Spiffical/seatube-downloader"
Documentation = "https://github.com/Spiffical/seatube-downloader/blob/main/docs/guide.md"
Issues = "https://github.com/Spiffical/seatube-downloader/issues"

[tool.setuptools.packages.find]
include = ["seatube*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: local ffmpeg integration; no network or credentials"]

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
